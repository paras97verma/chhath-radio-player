<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a1e;color:#e2e8f0;font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden;height:100vh;width:100vw}
#topbar{position:fixed;top:0;left:0;right:0;height:52px;background:rgba(10,10,30,.97);border-bottom:1px solid #2d2d5e;display:flex;align-items:center;padding:0 20px;gap:16px;z-index:1000;backdrop-filter:blur(8px)}
#topbar h1{font-size:16px;font-weight:700;color:#f59e0b;letter-spacing:.5px}
#topbar .sub{font-size:12px;color:#64748b}
.legend{display:flex;gap:12px;margin-left:auto;align-items:center;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:#94a3b8}
.legend-dot{width:10px;height:10px;border-radius:50%}
#filter-bar{position:fixed;top:62px;left:16px;display:flex;flex-direction:column;gap:6px;z-index:999}
.filter-btn{padding:5px 14px;border-radius:20px;border:1px solid #2d2d5e;background:rgba(15,15,40,.92);color:#94a3b8;font-size:11px;cursor:pointer;transition:all .2s;text-align:left}
.filter-btn:hover,.filter-btn.active{background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.4);color:#f59e0b}
#info-panel{position:fixed;top:62px;right:16px;width:290px;background:rgba(12,12,35,.98);border:1px solid #2d2d5e;border-radius:12px;padding:16px;z-index:999;display:none;backdrop-filter:blur(12px)}
#info-panel.visible{display:block}
#info-panel h3{font-size:14px;font-weight:700;color:#f59e0b;margin-bottom:3px}
.info-path{font-size:10px;color:#475569;font-family:monospace;margin-bottom:10px;word-break:break-all}
.info-desc{font-size:12px;color:#cbd5e1;line-height:1.65}
.info-deps{margin-top:10px}
.info-deps h4{font-size:10px;color:#64748b;margin-bottom:6px;text-transform:uppercase;letter-spacing:.8px}
.dep-tag{display:inline-block;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.25);color:#f59e0b;font-size:10px;padding:2px 7px;border-radius:4px;margin:2px;font-family:monospace}
.close-btn{position:absolute;top:10px;right:10px;background:none;border:none;color:#475569;cursor:pointer;font-size:16px;line-height:1}
.close-btn:hover{color:#e2e8f0}
#controls{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:1000}
.ctrl-btn{width:36px;height:36px;background:rgba(20,20,55,.92);border:1px solid #3d3d7e;border-radius:8px;color:#e2e8f0;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.ctrl-btn:hover{background:rgba(60,60,120,.9)}
#canvas{position:fixed;top:52px;left:0;right:0;bottom:0;cursor:grab}
#canvas:active{cursor:grabbing}
#tooltip{position:fixed;background:rgba(12,12,35,.97);border:1px solid #3d3d7e;border-radius:8px;padding:7px 11px;font-size:11px;color:#e2e8f0;pointer-events:none;z-index:2000;display:none;max-width:220px;line-height:1.5}
#search-box{position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:999}
#search-input{background:rgba(15,15,40,.95);border:1px solid #2d2d5e;border-radius:20px;color:#e2e8f0;font-size:12px;padding:6px 16px;width:220px;outline:none}
#search-input:focus{border-color:rgba(245,158,11,.5)}
#search-input::placeholder{color:#475569}

  {from:'api-presence',to:'presence-service',color:'#ef4444'},
  {from:'api-events',to:'presence-service',color:'#ef4444'},
  {from:'api-admin-auth',to:'security',color:'#ef4444'},
  {from:'api-admin-auth',to:'model-admin',color:'#64748b'},
  {from:'api-admin-songs',to:'auth-deps',color:'#ef4444'},
  {from:'api-admin-songs',to:'song-service',color:'#ef4444'},
  {from:'api-admin-songs',to:'model-song',color:'#64748b'},
{from:'song-service',to:'database',color:'#64748b'},
  {from:'song-service',to:'model-song',color:'#64748b'},
  {from:'security',to:'config',color:'#ef4444'},
  {from:'auth-deps',to:'security',color:'#ef4444'},
  {from:'model-song',to:'database',color:'#64748b'},
  {from:'model-channel',to:'database',color:'#64748b'},
  {from:'model-admin',to:'database',color:'#64748b'},
  {from:'api-songs',to:'model-song',color:'#64748b'},
  {from:'api-radio',to:'model-channel',color:'#64748b'},
  {from:'GhatAmbience',to:'sounds',color:'#64748b'},
  {from:'test-unit-be',to:'presence-service',color:'#475569'},
  {from:'test-unit-be',to:'song-service',color:'#475569'},
  {from:'test-int-be',to:'api-songs',color:'#475569'},
  {from:'test-int-be',to:'api-events',color:'#475569'},
  {from:'test-unit-fe',to:'radio-store',color:'#475569'},
  {from:'test-unit-fe',to:'time-of-day',color:'#475569'},
  {from:'test-e2e',to:'page-home',color:'#475569'},
  {from:'load-test',to:'api-songs',color:'#475569'},
  {from:'load-test',to:'api-events',color:'#475569'},
  {from:'smoke-test',to:'api-songs',color:'#475569'},
  {from:'smoke-test',to:'api-facts',color:'#475569'}
];

const nodeMap=Object.fromEntries(NODES.map(n=>[n.id,n]));
const W=130,H=52;

function markerFor(c){
  if(c==='#10b981')return'url(#arr-green)';
  if(c==='#3b82f6')return'url(#arr-blue)';
  if(c==='#8b5cf6')return'url(#arr-purple)';
  if(c==='#f59e0b')return'url(#arr-amber)';
  if(c==='#ef4444')return'url(#arr-red)';
  return'url(#arr-gray)';
}

let tx=80,ty=60,scale=0.72;
let dragging=false,lastX=0,lastY=0;
let activeFilter='all';

const svg=document.getElementById('canvas');
const root=document.getElementById('root-g');

function applyTransform(){root.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);}

function build(){
  root.innerHTML='';
  const groups={};
  NODES.forEach(n=>{const k=n.layer+':'+n.group;if(!groups[k])groups[k]={nodes:[],layer:n.layer};groups[k].nodes.push(n);});
  const gColors={'frontend:pages':'rgba(245,158,11,.06)','frontend:components':'rgba(59,130,246,.05)','frontend:lib':'rgba(139,92,246,.06)','backend:api':'rgba(16,185,129,.05)','backend:services':'rgba(239,68,68,.06)','backend:models':'rgba(100,116,139,.05)','infra:infra':'rgba(100,116,139,.04)','tests:tests':'rgba(71,85,105,.05)'};
  const gLabels={'frontend:pages':'Pages','frontend:components':'Components','frontend:lib':'Lib / Store','backend:api':'API Routes','backend:services':'Services','backend:models':'Models','infra:infra':'Infrastructure','tests:tests':'Tests'};

  Object.entries(groups).forEach(([k,g])=>{
    const xs=g.nodes.map(n=>n.x),ys=g.nodes.map(n=>n.y);
    const pad=24,bx=Math.min(...xs)-pad,by=Math.min(...ys)-pad;
    const bw=Math.max(...xs)-Math.min(...xs)+W+pad*2,bh=Math.max(...ys)-Math.min(...ys)+H+pad*2;
    const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('x',bx);r.setAttribute('y',by);r.setAttribute('width',bw);r.setAttribute('height',bh);
    r.setAttribute('rx',16);r.setAttribute('fill',gColors[k]||'rgba(255,255,255,.02)');
    r.setAttribute('stroke','rgba(255,255,255,.06)');r.setAttribute('stroke-width','1');r.setAttribute('pointer-events','none');
    root.appendChild(r);
    const lbl=document.createElementNS('http://www.w3.org/2000/svg','text');
    lbl.setAttribute('x',bx+10);lbl.setAttribute('y',by+16);lbl.setAttribute('fill','rgba(255,255,255,.2)');
    lbl.setAttribute('font-size','10');lbl.setAttribute('font-weight','700');lbl.setAttribute('letter-spacing','1.5');lbl.setAttribute('pointer-events','none');
    lbl.textContent=(gLabels[k]||k).toUpperCase();root.appendChild(lbl);
  });

  EDGES.forEach(e=>{
    const a=nodeMap[e.from],b=nodeMap[e.to];if(!a||!b)return;
    const x1=a.x+W/2,y1=a.y+H/2,x2=b.x+W/2,y2=b.y+H/2;
    const mx=(x1+x2)/2,my=(y1+y2)/2;
    const p=document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d',`M${x1},${y1} Q${mx},${my} ${x2},${y2}`);
    p.setAttribute('fill','none');p.setAttribute('stroke',e.color);p.setAttribute('stroke-width','1.5');
    p.setAttribute('opacity','0.3');p.setAttribute('marker-end',markerFor(e.color));
    p.dataset.from=e.from;p.dataset.to=e.to;p.classList.add('edge');
    root.appendChild(p);
  });

  NODES.forEach(n=>{
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('transform',`translate(${n.x},${n.y})`);g.classList.add('node');g.dataset.id=n.id;g.dataset.layer=n.layer;

    const sh=document.createElementNS('http://www.w3.org/2000/svg','rect');
    sh.setAttribute('x',3);sh.setAttribute('y',3);sh.setAttribute('width',W);sh.setAttribute('height',H);
    sh.setAttribute('rx',8);sh.setAttribute('fill','rgba(0,0,0,.4)');g.appendChild(sh);

    const rc=document.createElementNS('http://www.w3.org/2000/svg','rect');
    rc.setAttribute('width',W);rc.setAttribute('height',H);rc.setAttribute('rx',8);
    rc.setAttribute('fill',n.color+'22');rc.setAttribute('stroke',n.color);rc.setAttribute('stroke-width','1.5');g.appendChild(rc);

    const bar=document.createElementNS('http://www.w3.org/2000/svg','rect');
    bar.setAttribute('width',4);bar.setAttribute('height',H);bar.setAttribute('rx',2);bar.setAttribute('fill',n.color);g.appendChild(bar);

    const t1=document.createElementNS('http://www.w3.org/2000/svg','text');
    t1.setAttribute('x',14);t1.setAttribute('y',22);t1.setAttribute('fill','#fff');t1.setAttribute('font-size','11');t1.setAttribute('font-weight','700');t1.setAttribute('pointer-events','none');
    t1.textContent=n.label.length>16?n.label.slice(0,15)+'...':n.label;g.appendChild(t1);

    const t2=document.createElementNS('http://www.w3.org/2000/svg','text');
    t2.setAttribute('x',14);t2.setAttribute('y',38);t2.setAttribute('fill','rgba(255,255,255,.5)');t2.setAttribute('font-size','9');t2.setAttribute('pointer-events','none');
    t2.textContent=n.sub.length>20?n.sub.slice(0,19)+'...':n.sub;g.appendChild(t2);

    g.addEventListener('click',()=>selectNode(n.id));
    g.addEventListener('mouseenter',ev=>showTip(ev,n));
    g.addEventListener('mouseleave',hideTip);
    root.appendChild(g);
  });
  applyTransform();applyFilter(activeFilter);
}

function selectNode(id){
  const n=nodeMap[id];if(!n)return;
  const connected=new Set([id]);
  document.querySelectorAll('.edge').forEach(e=>{
    if(e.dataset.from===id||e.dataset.to===id){connected.add(e.dataset.from);connected.add(e.dataset.to);e.setAttribute('opacity','0.85');e.setAttribute('stroke-width','2.5');}
    else{e.setAttribute('opacity','0.04');e.setAttribute('stroke-width','1');}
  });
  document.querySelectorAll('.node').forEach(g=>{
    if(connected.has(g.dataset.id)){g.style.opacity='1';g.style.filter=g.dataset.id===id?'brightness(1.4)':'brightness(1.1)';}
    else{g.style.opacity='0.12';g.style.filter='';}
  });
  document.getElementById('panel-title').textContent=n.label;
  document.getElementById('panel-path').textContent=n.path;
  document.getElementById('panel-desc').textContent=n.desc;
  const de=document.getElementById('panel-deps');
  de.innerHTML='<h4>Dependencies</h4>'+(n.deps&&n.deps.length?n.deps.map(d=>`<span class="dep-tag">${d}</span>`).join(''):'<span style="color:#475569;font-size:11px">None</span>');
  document.getElementById('info-panel').classList.add('visible');
}

function closePanel(){
  document.getElementById('info-panel').classList.remove('visible');
  document.querySelectorAll('.edge').forEach(e=>{e.setAttribute('opacity','0.3');e.setAttribute('stroke-width','1.5');});
  document.querySelectorAll('.node').forEach(g=>{g.style.opacity='';g.style.filter='';});
}

function applyFilter(f){
  activeFilter=f;
  document.querySelectorAll('.node').forEach(g=>{g.style.display=(f==='all'||g.dataset.layer===f)?'':'none';});
  document.querySelectorAll('.edge').forEach(e=>{
    const a=nodeMap[e.dataset.from],b=nodeMap[e.dataset.to];
    e.style.display=(f==='all'||(a&&a.layer===f)||(b&&b.layer===f))?'':'none';
  });
}

document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');closePanel();applyFilter(btn.dataset.filter);
  });
});

document.getElementById('search-input').addEventListener('input',function(){
  const q=this.value.toLowerCase().trim();
  if(!q){closePanel();applyFilter(activeFilter);return;}
  document.querySelectorAll('.node').forEach(g=>{
    const n=nodeMap[g.dataset.id];
    const m=n&&(n.label.toLowerCase().includes(q)||n.sub.toLowerCase().includes(q)||n.path.toLowerCase().includes(q));
    g.style.opacity=m?'1':'0.08';g.style.filter=m?'brightness(1.3)':'';
  });
});

const tip=document.getElementById('tooltip');
function showTip(ev,n){tip.innerHTML=`<strong style="color:${n.color}">${n.label}</strong><br/><span style="color:#64748b;font-size:10px">${n.path}</span>`;tip.style.display='block';moveTip(ev);}
function moveTip(ev){tip.style.left=(ev.clientX+14)+'px';tip.style.top=(ev.clientY-10)+'px';}
function hideTip(){tip.style.display='none';}
svg.addEventListener('mousemove',moveTip);

svg.addEventListener('mousedown',e=>{if(e.target.closest('.node'))return;dragging=true;lastX=e.clientX;lastY=e.clientY;});
window.addEventListener('mouseup',()=>{dragging=false;});
window.addEventListener('mousemove',e=>{if(!dragging)return;tx+=e.clientX-lastX;ty+=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;applyTransform();});
svg.addEventListener('wheel',e=>{
  e.preventDefault();const f=e.deltaY<0?1.1:0.9;
  const r=svg.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  tx=mx-(mx-tx)*f;ty=my-(my-ty)*f;scale=Math.max(0.2,Math.min(3,scale*f));applyTransform();
},{passive:false});

document.getElementById('zoom-in').onclick=()=>{scale=Math.min(3,scale*1.2);applyTransform();};
document.getElementById('zoom-out').onclick=()=>{scale=Math.max(0.2,scale/1.2);applyTransform();};
document.getElementById('zoom-reset').onclick=()=>{tx=80;ty=60;scale=0.72;applyTransform();};

build();
</script>
</body>
</html>
