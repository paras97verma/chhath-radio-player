# =============================================================================
# Chhath Radio — Seed Admin Pipeline
#
# Dedicated on-demand workflow to create or update the admin user.
# Triggered manually from GitHub Actions → "Database — Seed Admin" → Run workflow.
#
# Form inputs:
#   admin_email    — Admin email (optional: defaults to ADMIN_EMAIL secret)
#   admin_password — Admin password (optional: defaults to ADMIN_PASSWORD secret)
#
# Required GitHub Secrets:
#   DATABASE_URL   — Supabase PostgreSQL connection string
#   REDIS_URL      — Upstash Redis URL
#   SECRET_KEY     — JWT secret
#   ADMIN_EMAIL    — Default fallback admin email
#   ADMIN_PASSWORD — Default fallback admin password
# =============================================================================

name: Database — Seed Admin

on:
  workflow_dispatch:
    inputs:
      admin_email:
        description: 'Admin email (leave blank to use ADMIN_EMAIL repository secret)'
        required: false
        default: ''
      admin_password:
        description: 'Admin password (leave blank to use ADMIN_PASSWORD repository secret)'
        required: false
        default: ''

env:
  PYTHON_VERSION: '3.12'

jobs:
  seed-admin:
    name: Seed Admin User
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Ensure DB schema is up to date
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          echo "Running: alembic upgrade head"
          alembic upgrade head

      - name: Seed admin user
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_EMAIL: ${{ github.event.inputs.admin_email != '' && github.event.inputs.admin_email || secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ github.event.inputs.admin_password != '' && github.event.inputs.admin_password || secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "ERROR: Admin email or password is empty."
            echo "Please provide admin_email and admin_password in the form or configure ADMIN_EMAIL / ADMIN_PASSWORD repository secrets."
            exit 1
          fi
          echo "Seeding admin user: $ADMIN_EMAIL"
          python seed_admin.py
          echo "✓ Admin seed complete"

