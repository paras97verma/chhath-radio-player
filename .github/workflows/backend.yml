# =============================================================================
# Chhath Radio — Backend CI/CD
#
# Backend changes on main run the test/deploy pipeline. Same-repository PRs run
# a Layerbase Redis liveness check only; they never deploy.
# Pipeline:
#   1. Run pytest with real PostgreSQL + Redis services on main
#   2. Verify Layerbase Redis on PRs and before each production deploy
#   3. On main, update Render env vars + trigger deploy
#   4. Poll backend health endpoint until healthy
#
# Required GitHub Secrets (set via scripts/deploy-setup.sh):
#   RENDER_API_KEY          — Render account API key
#   RENDER_SERVICE_ID       — Render web service ID (srv-xxxxxxxx)
#   RENDER_DEPLOY_HOOK_URL  — Render deploy hook URL
#   NEXT_PUBLIC_API_URL     — Backend public URL (used for health check)
#   DATABASE_URL            — Supabase PostgreSQL connection string
#   REDIS_URL               — Layerbase Redis TLS URL (preflighted before deploy)
#   SECRET_KEY              — JWT signing secret (min 32 chars)
#   ADMIN_EMAIL             — First admin account email
#   ADMIN_PASSWORD          — First admin account password
# =============================================================================

name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - 'scripts/check-layerbase-redis.py'
      - 'scripts/diagnose-layerbase-runtime.py'
      - 'scripts/update-render-env.py'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
      - 'scripts/check-layerbase-redis.py'
      - 'scripts/diagnose-layerbase-runtime.py'
      - 'scripts/update-render-env.py'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual deploy'
      warm_missing:
        description: 'Rewarm only enabled catalog songs missing a valid Layerbase cache record'
        required: false
        type: boolean
        default: false

env:
  PYTHON_VERSION: '3.12'

permissions:
  contents: read

jobs:
  verify-layerbase:
    name: Verify Layerbase Redis
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Redis client
        run: pip install --disable-pip-version-check --no-input redis==5.0.4

      - name: Ping Layerbase Redis
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: python scripts/check-layerbase-redis.py

      - name: Inspect production cache status and Render logs
        if: github.event_name == 'workflow_dispatch'
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          WARM_MISSING: ${{ inputs.warm_missing }}
        run: python scripts/diagnose-layerbase-runtime.py

  # ── Job 1: Run all backend tests ──────────────────────────────────────────
  test:
    name: pytest
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chhath_test
          POSTGRES_USER: chhath
          POSTGRES_PASSWORD: chhath
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U chhath -d chhath_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://chhath:chhath@localhost:5432/chhath_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-minimum-32-characters-long
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run Alembic migrations on test DB
        working-directory: backend
        run: alembic upgrade head

      - name: Run pytest
        working-directory: backend
        run: pytest -x -q --tb=short

  # ── Job 2: Deploy backend to Render with the provisioned Layerbase Redis ──
  deploy:
    name: Deploy to Render
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Redis client
        run: pip install --disable-pip-version-check --no-input redis==5.0.4

      - name: Validate Layerbase Redis connection
        env:
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: python scripts/check-layerbase-redis.py

      - name: Update env vars on Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CALENDARIFIC_API_KEY: ${{ secrets.CALENDARIFIC_API_KEY }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          INVIDIOUS_INSTANCES: ${{ secrets.INVIDIOUS_INSTANCES }}
          INVIDIOUS_REQUESTS_PER_SECOND: ${{ secrets.INVIDIOUS_REQUESTS_PER_SECOND }}
          INVIDIOUS_MAX_CONCURRENCY: ${{ secrets.INVIDIOUS_MAX_CONCURRENCY }}
        run: python scripts/update-render-env.py

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          : "${RENDER_DEPLOY_HOOK_URL:?Missing RENDER_DEPLOY_HOOK_URL}"
          echo "Triggering Render deploy..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 10 --max-time 30 \
            -X POST "$RENDER_DEPLOY_HOOK_URL" || true)
          echo "Render deploy hook: HTTP $HTTP_STATUS"
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "ERROR: Render deploy hook returned HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "✓ Render deploy triggered"

      - name: Wait for backend health check
        env:
          HEALTH_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}/api/health
        run: |
          echo "Polling $HEALTH_URL (Render may take 2-5 min on first deploy)..."
          MAX_ATTEMPTS=20
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Backend is healthy!"
              exit 0
            fi
            sleep 30
          done
          echo "ERROR: Backend health check timed out after $MAX_ATTEMPTS attempts."
          exit 1
