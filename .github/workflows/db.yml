# =============================================================================
# Chhath Radio — Database Operations Pipeline
#
# On-demand workflow for database management tasks.
# Triggered manually from GitHub Actions → "Database Operations" → Run workflow.
#
# Operations:
#   migrate                                — Run Alembic migrations (alembic upgrade head)
#   seed-songs (append to list)            — Append songs from scripts/songs.txt
#   seed-songs (delete entire and then seed) — Wipe songs table and re-seed
#   seed-admin                             — Seed admin user using repo secrets
#   rollback                               — Roll back the last migration (alembic downgrade -1)
#   status                                 — Show current migration status (alembic current)
#
# Note:
#   For interactive custom admin credentials, use the dedicated
#   "Database — Seed Admin" workflow.
#   For dedicated song seeding, use the "Database — Seed Songs" workflow.
# =============================================================================

name: Database Operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Database operation to run'
        required: true
        type: choice
        options:
          - migrate
          - seed-songs (append to list)
          - seed-songs (delete entire and then seed)
          - seed-admin
          - rollback
          - status
      confirm:
        description: 'Type "yes" to confirm destructive operations (rollback / delete entire)'
        required: false
        default: 'no'

env:
  PYTHON_VERSION: '3.12'

jobs:
  db-operation:
    name: ${{ github.event.inputs.operation }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # ── migrate ─────────────────────────────────────────────────────────────
      - name: Run Alembic migrations
        if: github.event.inputs.operation == 'migrate'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          echo "Running: alembic upgrade head"
          alembic upgrade head
          echo ""
          echo "Current migration state:"
          alembic current
          echo "✓ Migrations complete"

      # ── seed-songs (append to list) ─────────────────────────────────────────
      - name: Seed songs (append to list)
        if: github.event.inputs.operation == 'seed-songs (append to list)' || github.event.inputs.operation == 'seed-songs'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          echo "Running: alembic upgrade head (ensure schema is current)"
          alembic upgrade head
          echo ""
          SONGS_FILE=""
          if [ -f "data/songs.txt" ]; then
            SONGS_FILE="data/songs.txt"
          elif [ -f "../scripts/songs.txt" ]; then
            SONGS_FILE="../scripts/songs.txt"
          fi
          echo "➕ Appending songs (idempotent, skipping duplicates)..."
          if [ -n "$SONGS_FILE" ]; then
            python seed_songs.py --file "$SONGS_FILE"
          else
            python seed_songs.py
          fi
          echo "✓ Song seed complete"

      # ── seed-songs (delete entire and then seed) ───────────────────────────
      - name: Seed songs (delete entire and then seed)
        if: github.event.inputs.operation == 'seed-songs (delete entire and then seed)'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          echo "Running: alembic upgrade head (ensure schema is current)"
          alembic upgrade head
          echo ""
          SONGS_FILE=""
          if [ -f "data/songs.txt" ]; then
            SONGS_FILE="data/songs.txt"
          elif [ -f "../scripts/songs.txt" ]; then
            SONGS_FILE="../scripts/songs.txt"
          fi
          echo "🗑 Deleting entire songs table and re-seeding..."
          if [ -n "$SONGS_FILE" ]; then
            python seed_songs.py --file "$SONGS_FILE" --clear
          else
            python seed_songs.py --clear
          fi
          echo "✓ Song seed complete"

      # ── seed-admin ──────────────────────────────────────────────────────────
      - name: Seed admin user
        if: github.event.inputs.operation == 'seed-admin'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "$ADMIN_EMAIL" ] || [ -z "$ADMIN_PASSWORD" ]; then
            echo "ERROR: ADMIN_EMAIL or ADMIN_PASSWORD secret is not set."
            echo "To supply custom email and password via form, use the dedicated 'Database — Seed Admin' workflow."
            exit 1
          fi
          echo "Running: alembic upgrade head (ensure schema is current)"
          alembic upgrade head
          echo ""
          echo "Seeding admin user from secrets: $ADMIN_EMAIL"
          python seed_admin.py
          echo "✓ Admin seed complete"

      # ── rollback ────────────────────────────────────────────────────────────
      - name: Rollback last migration
        if: github.event.inputs.operation == 'rollback'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "yes" ]; then
            echo "ERROR: Rollback requires confirm='yes'. Re-run with confirm set to 'yes'."
            exit 1
          fi
          echo "WARNING: Rolling back last migration..."
          alembic current
          alembic downgrade -1
          echo ""
          echo "Current state after rollback:"
          alembic current
          echo "✓ Rollback complete"

      # ── status ──────────────────────────────────────────────────────────────
      - name: Show migration status
        if: github.event.inputs.operation == 'status'
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          echo "Current migration state:"
          alembic current
          echo ""
          echo "Migration history:"
          alembic history --verbose
