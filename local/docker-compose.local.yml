# ============================================================
# Chhath Radio — Full-Stack LOCAL Docker Compose
#
# Runs ALL services end-to-end on your local machine:
#   postgres  — primary database (port 5432)
#   redis     — presence / session store (port 6379)
#   backend   — FastAPI via Uvicorn with --reload (port 8000)
#   frontend  — Next.js in DEV mode with hot reload (port 3000)
#
# Source code is MOUNTED so any file change is picked up
# instantly — no rebuild needed.
#
# Usage (from project root):
#   ./local/run-local.sh
#
# Or manually:
#   docker compose -f local/docker-compose.local.yml up
# ============================================================

services:
  # ── Infrastructure ──────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: chhath_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chhath
      POSTGRES_PASSWORD: chhath
      POSTGRES_DB: chhath_radio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chhath -d chhath_radio"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chhath_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend — dev mode with hot reload ──────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: chhath_backend
    restart: unless-stopped
    # Override the production CMD with uvicorn --reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql://chhath:chhath@postgres:5432/chhath_radio
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    # Mount source so --reload picks up changes immediately
    volumes:
      - ../backend:/app
      # Mount scripts dir so seed_songs.py can read songs.txt
      - ../scripts:/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Frontend — Next.js dev server with hot reload ────────────
  frontend:
    image: node:20-alpine
    container_name: chhath_frontend
    restart: unless-stopped
    working_dir: /app
    # Run Next.js dev server (HMR enabled)
    command: sh -c "npm install --legacy-peer-deps && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Server-side rewrite target: Next.js → FastAPI (Docker service name)
      BACKEND_URL: http://chhath_backend:8000
      # Needed for Next.js HMR inside Docker
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    # Mount source — any file change triggers HMR instantly
    volumes:
      - ../frontend:/app
      # Preserve node_modules inside container (don't overwrite with host)
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  frontend_next_cache: