# =============================================================================
# Chhath Radio — Production-Parity Docker Compose
#
# This compose file builds and runs the SAME Docker images as production.
# Use it to verify the production build locally before deploying.
#
# Modes (via local/run-local.sh):
#   Production mimic  → docker compose up --build
#   Hot-reload dev    → docker compose -f local/docker-compose.local.yml up
#
# Services:
#   db       — PostgreSQL 16 (mirrors Supabase schema)
#   redis    — Redis 7 (mirrors Upstash)
#   backend  — FastAPI via Gunicorn + Uvicorn (production image)
#   frontend — Next.js standalone (production image)
#
# Environment:
#   Copy backend/.env.example → backend/.env and fill in values.
#   Copy frontend/.env.example → frontend/.env.local and fill in values.
#   NEXT_PUBLIC_* vars are passed as build args at build time.
# =============================================================================

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: chhath_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chhath_radio}
      POSTGRES_USER: ${POSTGRES_USER:-chhath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chhath_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chhath_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chhath} -d ${POSTGRES_DB:-chhath_radio}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5432:5432"

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: chhath_redis
    restart: unless-stopped
    command: >
      redis-server
      --save 60 1
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - chhath_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"

  # ── Backend (FastAPI — production image, same as Render) ────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chhath_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Internal Docker network URLs — override .env values for container-to-container
      DATABASE_URL: postgresql://${POSTGRES_USER:-chhath}:${POSTGRES_PASSWORD:-chhath_secret}@db:5432/${POSTGRES_DB:-chhath_radio}
      REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - chhath_net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Frontend (Next.js — production image, same as Vercel build) ─────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* vars baked in at build time.
        # For local production-mimic, these point to the local backend.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    container_name: chhath_frontend
    restart: unless-stopped
    environment:
      # Runtime env vars for Next.js server (not baked in — server-side only)
      BACKEND_URL: http://chhath_backend:8000
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - chhath_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  chhath_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data: